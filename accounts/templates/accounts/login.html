{% extends 'base.html' %}

{% block content %}
<style media="screen">
  .login {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #f2f2f2;
    text-align: center;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  }
  .login{
    font-size: 200% !important;
  }
  .button{
    font-size: 100%;
  }
  .errorlist{
    display: none;
  }
  label{
    min-width: 200px;
  }
</style>
  <div class="login form-group" align= center>

    <h2>Entrez vos identifiants: </h2>
    {% if form.errors %}
      <p>Le nom d'utilisateur et le mot de passe ne correspondent pas !</p>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      {{form.as_p}}

      <input type="submit" class='button btn btn-primary' value="Login" />
      <input type="hidden" name="next" value="{{ next }}" />
    </form>
  </div>
{% endblock %}
